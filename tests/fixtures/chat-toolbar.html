<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat AI Enhancer toolbar fixture</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f8fafd;
            color: #1f1f1f;
            font: 14px/1.5 Arial, sans-serif;
        }
        .chat-shell {
            width: min(820px, calc(100vw - 32px));
            height: min(640px, calc(100vh - 32px));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #dde3ea;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(60, 64, 67, .12);
        }
        .chat-header {
            padding: 18px 22px;
            border-bottom: 1px solid #e6e9ed;
            font-size: 18px;
            font-weight: 600;
        }
        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: end;
            gap: 14px;
            overflow: auto;
            padding: 24px;
        }
        .message-envelope { display: grid; gap: 4px; }
        .message-envelope.self { justify-items: start; }
        .message-envelope.other { justify-items: end; }
        .message-author { color: #5f6368; font-size: 12px; }
        .YJxKBc { position: relative; }
        .EAOoq {
            max-width: 520px;
            padding: 10px 14px;
            border-radius: 16px;
            background: #f0f4f9;
        }
        .self .EAOoq { background: #d3e3fd; }
        [data-is-viewer-message-creator] { display: none; }
        .dJ9vNe {
            display: flex;
            align-items: end;
            gap: 8px;
            min-height: 76px;
            padding: 10px 14px;
            border-top: 1px solid #e6e9ed;
        }
        .EFNTcf {
            flex: 0 0 auto;
            height: 36px;
            overflow: hidden;
        }
        .native-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .native-actions > button,
        .send-button {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #444746;
            cursor: pointer;
            font-size: 17px;
        }
        .native-actions > button:hover { background: #edf2fa; }
        .compose-main {
            min-width: 0;
            flex: 1 1 auto;
            display: flex;
            align-items: end;
            gap: 8px;
        }
        .input-wrap {
            min-width: 0;
            flex: 1 1 auto;
            min-height: 44px;
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 22px;
            background: #f0f4f9;
        }
        [role="textbox"] {
            width: 100%;
            min-height: 22px;
            outline: none;
        }
        .send-button {
            flex: 0 0 auto;
            background: #0b57d0;
            color: #fff;
        }
        @media (max-width: 700px) {
            .chat-shell { width: calc(100vw - 16px); }
            .native-actions > button:nth-child(n+3) { display: none; }
        }
    </style>
</head>
<body>
<main class="chat-shell" role="main">
    <div class="chat-header" role="heading" aria-level="2">שיחת בדיקה</div>
    <section class="messages" aria-label="הודעות">
        <div class="message-envelope other">
            <span class="message-author" data-message-id="m1" data-is-message="true">דנה</span>
            <div class="YJxKBc">
                <div class="EAOoq"><div class="DTp27d QIJiHb">אפשר לעדכן מתי זה יהיה מוכן?</div></div>
                <div data-is-viewer-message-creator="false"></div>
            </div>
        </div>
        <div class="message-envelope self">
            <span class="message-author" data-message-id="m2" data-is-message="true">אני</span>
            <div class="YJxKBc">
                <div class="EAOoq"><div class="DTp27d QIJiHb">כן, אני בודק ואעדכן בקרוב.</div></div>
                <div data-is-viewer-message-creator="true"></div>
            </div>
        </div>
    </section>
    <div class="dJ9vNe">
        <div class="EFNTcf">
            <div class="native-actions" aria-label="פעולות קיימות">
                <button type="button" aria-label="אפשרויות עיצוב">A</button>
                <button type="button" aria-label="הוספת אמוג׳י">☺</button>
                <button type="button" aria-label="העלאת קובץ">＋</button>
                <button type="button" aria-label="הוספת GIF או סטיקר">GIF</button>
            </div>
        </div>
        <div class="compose-main">
            <div class="input-wrap">
                <div role="textbox" contenteditable="true" aria-label="כתיבת הודעה"></div>
            </div>
            <button class="send-button" type="button" aria-label="שליחת הודעה">›</button>
        </div>
    </div>
</main>
<script src="../../chat-ai-enhancer.user.js"></script>
</body>
</html>
